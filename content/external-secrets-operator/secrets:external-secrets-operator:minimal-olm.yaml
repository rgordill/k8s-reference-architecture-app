---
- name: 'secrets:external-secrets-operator:minimal-olm'
  description: |-
    Single-replica External Secrets Operator deployed by OLM on Red Hat OpenShift.
    Includes the operator plus the external-secrets operand (core controller, webhook,
    and cert controller) that synchronizes secrets from external providers into
    Kubernetes Secrets.
  icon:
    type: url
    value: https://raw.githubusercontent.com/external-secrets/external-secrets/main/docs/pictures/eso-round-logo.svg
  characteristics:
  - Operator-managed via OLM.
  - Single replica per operand component.
  - FIPS compliant on OpenShift.
  - Supports 30+ external secret providers.
  version: '1.2'
  usage:
  - Development
  - Edge
  - Testing
  tags:
  - external-secrets-operator
  - development
  - deploy:operator
  dependencies: {}
  components:
  - external-secrets-operator
  - external-secrets
  - external-secrets-webhook
  - external-secrets-cert-controller
  source:
  - https://github.com/external-secrets/external-secrets
  - https://github.com/openshift/external-secrets-operator
  documentation:
  - https://external-secrets.io/latest/
  - https://external-secrets.io/latest/api/components/
  - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/security_and_compliance/external-secrets-operator-for-red-hat-openshift
  diagram:
    nodes:
    - id: external-secrets-operator
      name: Operator
      component: external-secrets-operator
      style: external-secrets-operator
    - id: external-secrets
      name: Core Controller
      component: external-secrets
      style: external-secrets-application
    - id: external-secrets-webhook
      name: Webhook
      component: external-secrets-webhook
      style: external-secrets-application
    - id: external-secrets-cert-controller
      name: Cert Controller
      component: external-secrets-cert-controller
      style: external-secrets-application
    groups:
    - id: operands
      name: Operands
      style: role
      nodes:
      - external-secrets
      - external-secrets-webhook
      - external-secrets-cert-controller
    edges:
    - source: external-secrets-operator
      target: operands
      style: operator-manage
    - source: external-secrets-cert-controller
      target: external-secrets-webhook
      style: application-connect
    - source: external-secrets-webhook
      target: external-secrets
      style: application-connect
  sizing:
    - name: min
      description: |-
        Start up
      components:
      - external-secrets-operator:
          replicas: 1
          memory: 50Mi
          cpu: 5m
      - external-secrets:
          replicas: 1
          memory: 60Mi
          cpu: 2m
      - external-secrets-webhook:
          replicas: 1
          memory: 40Mi
          cpu: 1m
      - external-secrets-cert-controller:
          replicas: 1
          memory: 100Mi
          cpu: 5m