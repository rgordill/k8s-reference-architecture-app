---
- name: 'secrets:external-secrets-operator:multi-helm'
  description: |-
    Highly available External Secrets Operator deployed via Helm.
    Replica counts: core controller 2 (active/passive), webhook 3 (minimum for
    multi-zone availability), cert controller 2 (active/passive). 
    The webhook replicas allow a zone outage to be tolerated.
  icon:
    type: url
    value: https://raw.githubusercontent.com/external-secrets/external-secrets/main/docs/pictures/eso-round-logo.svg
  characteristics:
  - Deployed via Helm.
  - High availability multi-zone.
  - Supports 30+ external secret providers.
  version: '2.12'
  usage:
  - High availability testing
  - Production
  tags:
  - external-secrets-operator
  - high-availability
  - production
  - deploy:helm
  dependencies:
  - monitoring:prometheus
  - certificates:cert-manager
  components:
  - external-secrets-operator
  - external-secrets
  - external-secrets-webhook
  - external-secrets-cert-controller
  source:
  - https://github.com/external-secrets/external-secrets
  documentation:
  - https://external-secrets.io/latest/
  - https://external-secrets.io/latest/api/components/
  diagram:
    nodes:
    - id: external-secrets-cert-controller-0
      name: 'Cert Controller~0~'
      component: external-secrets-cert-controller
      style: external-secrets-application
    - id: external-secrets-cert-controller-1
      name: 'Cert Controller~1~'
      component: external-secrets-cert-controller
      style: external-secrets-application-standby
    - id: empty-2
      name: 'Empty~2~'
      style: empty
    - id: external-secrets-webhook-0
      name: 'Webhook~0~'
      component: external-secrets-webhook
      style: external-secrets-application
    - id: external-secrets-webhook-1
      name: 'Webhook~1~'
      component: external-secrets-webhook
      style: external-secrets-application
    - id: external-secrets-webhook-2
      name: 'Webhook~2~'
      component: external-secrets-webhook
      style: external-secrets-application
    - id: external-secrets-0
      name: 'Core Controller~0~'
      component: external-secrets
      style: external-secrets-application
    - id: external-secrets-1
      name: 'Core Controller~1~'
      component: external-secrets
      style: external-secrets-application-standby
    - id: empty-1
      name: 'Empty~1~'
      style: empty
    groups:
    - id: group-certcontrollers
      name: Cert Controllers
      style: role
      nodes:
      - external-secrets-cert-controller-0
      - external-secrets-cert-controller-1
      - empty-2
    - id: group-webhooks
      name: Webhooks
      style: role
      nodes:
      - external-secrets-webhook-0
      - external-secrets-webhook-1
      - external-secrets-webhook-2
    # z prefix to go bottom
    - id: z-group-controllers
      name: Core Controllers
      style: role
      nodes:
      - external-secrets-0
      - external-secrets-1
      - empty-1
    - id: zone-a
      name: 'Zone~a~'
      style: zone
      nodes:
      - external-secrets-0
      - external-secrets-cert-controller-0
      - external-secrets-webhook-0
    - id: zone-b
      name: 'Zone~b~'
      style: zone
      nodes:
      - external-secrets-1
      - empty-2
      - external-secrets-webhook-1
    - id: zone-c
      name: 'Zone~c~'
      style: zone
      nodes:
      - external-secrets-cert-controller-1
      - empty-1
      - external-secrets-webhook-2
    edges:
    - source: external-secrets-cert-controller-0
      target: external-secrets-webhook-0
      style: application-connect
    - source: external-secrets-cert-controller-0
      target: external-secrets-webhook-1
      style: standby
    - source: external-secrets-cert-controller-0
      target: external-secrets-webhook-2
      style: standby
    - source: external-secrets-cert-controller-1
      target: external-secrets-webhook-0
      style: standby
    - source: external-secrets-cert-controller-1
      target: external-secrets-webhook-1
      style: application-connect
    - source: external-secrets-cert-controller-1
      target: external-secrets-webhook-2
      style: application-connect
    - source: external-secrets-webhook-0
      target: external-secrets-0
      style: application-connect
    - source: external-secrets-webhook-0
      target: external-secrets-1
      style: standby
    - source: external-secrets-webhook-1
      target: external-secrets-0
      style: application-connect
    - source: external-secrets-webhook-1
      target: external-secrets-1
      style: standby
    - source: external-secrets-webhook-2
      target: external-secrets-0
      style: application-connect
    - source: external-secrets-webhook-2
      target: external-secrets-1
      style: standby
  sizing: {}