---
- name: 'certificates:cert-manager:multi-olm'
  description: |-
    Highly available cert-manager deployed by the cert-manager operator.
    Replica counts: controller 2 (active/passive), CA injector 2 (active/passive), 
    webhook 3 (minimum for multi-zone availability). The webhook replicas allow
    a zone outage to be tolerated, without the risk of only one replica left in
    that situation. The operator manages operand lifecycle.
  icon:
    type: url
    value: https://raw.githubusercontent.com/cncf/artwork/main/projects/cert-manager/icon/color/cert-manager-icon-color.svg
  characteristics:
  - Operator-managed.
  - High availability multi-zone.
  version: '1.20'
  usage:
  - High availability testing
  - Production
  tags:
  - cert-manager
  - high-availability
  - production
  - deploy:operator
  dependencies: {}
  components:
  - cert-manager-operator
  - cert-manager
  - cert-manager-ca-injector
  - cert-manager-webhook
  source:
  - https://github.com/cert-manager/cert-manager
  documentation:
  - https://deepwiki.com/cert-manager/cert-manager/1.1-core-components
  - https://cert-manager.io/docs/installation/best-practice/#high-availability
  - https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/security_and_compliance/cert-manager-operator-for-red-hat-openshift
  diagram:
    nodes:
    - id: cert-manager-operator
      name: Operator
      component: cert-manager-operator
      style: cert-manager-operator
    - id: cert-manager-0
      name: 'Controller~0~'
      component: cert-manager
      style: cert-manager-application
    - id: cert-manager-1
      name: 'Controller~1~'
      component: cert-manager
      style: cert-manager-application-standby
    - id: cert-manager-ca-injector-0
      name: 'CA Injector~0~'
      component: cert-manager-ca-injector
      style: cert-manager-application
    - id: cert-manager-ca-injector-1
      name: 'CA Injector~1~'
      component: cert-manager-ca-injector
      style: cert-manager-application-standby
    - id: cert-manager-webhook-0
      name: 'Webhook~0~'
      component: cert-manager-webhook
      style: cert-manager-application
    - id: cert-manager-webhook-1
      name: 'Webhook~1~'
      component: cert-manager-webhook
      style: cert-manager-application
    - id: cert-manager-webhook-2
      name: 'Webhook~2~'
      component: cert-manager-webhook
      style: cert-manager-application
    - id: empty-1
      name: 'Empty~1~'
      style: empty
    - id: empty-2
      name: 'Empty~2~'
      style: empty
    groups:
    - id: controllers
      name: Controllers
      style: role
      nodes:
      - cert-manager-0
      - cert-manager-1
      - empty-1
    - id: cainjectors
      name: CA Injectors
      style: role
      nodes:
      - cert-manager-ca-injector-0
      - cert-manager-ca-injector-1
      - empty-2
    - id: webhooks
      name: Webhooks
      style: role
      nodes:
      - cert-manager-webhook-0
      - cert-manager-webhook-1
      - cert-manager-webhook-2
    - id: operands
      name: Operands
      style: role
      groups:
      - controllers
      - cainjectors
      - webhooks
    - id: zone-a
      name: 'Zone~a~'
      style: zone
      nodes:
      - cert-manager-0
      - cert-manager-ca-injector-0
      - cert-manager-webhook-0
    - id: zone-b
      name: 'Zone~b~'
      style: zone
      nodes:
      - cert-manager-1
      - empty-2
      - cert-manager-webhook-1
    - id: zone-c
      name: 'Zone~c~'
      style: zone
      nodes:
      - cert-manager-ca-injector-1
      - empty-1
      - cert-manager-webhook-2
    edges:
    - source: cert-manager-operator
      target: operands
      style: operator-manage
    - source: cert-manager-webhook-0
      target: cert-manager-0
      style: application-connect
    - source: cert-manager-webhook-0
      target: cert-manager-1
      style: standby
    - source: cert-manager-webhook-1
      target: cert-manager-0
      style: application-connect
    - source: cert-manager-webhook-1
      target: cert-manager-1
      style: standby
    - source: cert-manager-webhook-2
      target: cert-manager-0
      style: application-connect
    - source: cert-manager-webhook-2
      target: cert-manager-1
      style: standby
    - source: cert-manager-ca-injector-0
      target: cert-manager-0
      style: application-connect
    - source: cert-manager-ca-injector-0
      target: cert-manager-1
      style: standby
    - source: cert-manager-ca-injector-1
      target: cert-manager-0
      style: standby
    - source: cert-manager-ca-injector-1
      target: cert-manager-1
      style: standby
  sizing:
    - name: min
      description: |-
        Start up
      components:
      - cert-manager-operator:
          replicas: 1
          memory: 100Mi
          cpu: 10m
      - cert-manager:
          replicas: 2
          memory: 50Mi
          cpu: 5m
      - cert-manager-ca-injector:
          replicas: 2
          memory: 100Mi
          cpu: 5m
      - cert-manager-webhook:
          replicas: 3
          memory: 20Mi
          cpu: 5m